server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse-proxy — keeps the browser on one origin (no CORS issues).
    # proxy_http_version 1.1 + clearing Connection enables HTTP keep-alive to
    # the Spring Boot backends (nginx defaults to HTTP/1.0, which forces a new
    # TCP connection per request). X-Forwarded-For lets Spring Boot log the
    # real client IP instead of the nginx container address.
    location /api/v1/bookings {
        proxy_pass http://booking-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/payments {
        proxy_pass http://payment-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/notifications {
        proxy_pass http://notification-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
